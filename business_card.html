<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的超炫 github.io 電子名片</title>
    <style>
        /* --- 核心樣式設定 --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 模擬 CRT 掃描線效果 */
            background-image: linear-gradient(rgba(18, 16, 16, 0.3) 50%, transparent 50%);
            background-size: 100% 4px;
        }

        /* --- 黑客矩陣背景 --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* --- 名片主體 --- */
        #card-container {
            width: 90%;
            max-width: 600px;
            background: rgba(0, 20, 40, 0.85); /* 半透明深藍背景 */
            border: 2px solid #0ff; /* 霓虹藍邊框 */
            box-shadow: 0 0 20px #0ff, 0 0 40px #0ff, inset 0 0 10px rgba(0, 255, 255, 0.5); /* 內外發光 */
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            backdrop-filter: blur(5px);
            position: relative;
        }

        /* --- 標題：終端機打字效果 --- */
        h1 {
            font-size: 2.5em;
            margin-top: 0;
            color: #f0f; /* 霓虹粉 */
            text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
            border-right: 3px solid #f0f;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3s steps(20, end), blink 0.7s infinite;
            display: inline-block;
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { from { border-right-color: transparent; } to { border-right-color: #f0f; } }

        p.bio {
            font-size: 1.2em;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            margin-bottom: 30px;
        }

        /* --- 按鈕區域 --- */
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            justify-content: center;
        }

        /* --- 核心按鈕樣式 --- */
        .meme-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #fff;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            opacity: 0.8;
        }

        /* 霓虹邊框效果 (預設灰色) */
        .meme-btn:hover {
            opacity: 1;
            transform: scale(1.05);
            border-color: #f0f; /* 懸停變粉色 */
            box-shadow: 0 0 15px #f0f, 0 0 30px #f0f;
            color: #f0f;
        }

        /* --- 迷因動圖樣式 --- */
        .meme-btn img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 5px;
            /* 預設也加一點點霓虹 */
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: border 0.3s ease;
        }

        .meme-btn:hover img {
            border: 1px solid #0ff; /* 懸停圖片邊框變藍 */
            box-shadow: 0 0 10px #0ff;
        }

        /* --- 頁尾 --- */
        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.4);
        }

        /* --- 小螢幕優化 --- */
        @media (max-width: 600px) {
            body, html {
                overflow: auto; /* 允許小螢幕滾動 */
            }
            #card-container {
                padding: 20px;
                width: 95%;
                max-width: 420px;
                border-radius: 12px;
            }
            h1 {
                font-size: 1.8em;
                border-right: 2px solid #f0f;
                text-shadow: 0 0 6px #f0f;
            }
            p.bio {
                font-size: 1em;
                margin-bottom: 18px;
            }
            .links-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .meme-btn {
                padding: 10px;
                border-radius: 8px;
            }
            .meme-btn img {
                width: 56px;
                height: 56px;
            }
            footer {
                position: static;
                margin-top: 18px;
                color: rgba(255,255,255,0.35);
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 1.4em;
            }
            p.bio { font-size: 0.95em; }
            .meme-btn img { width: 48px; height: 48px; }
            #card-container { padding: 14px; }
        }

    </style>
</head>
<body>

    <!-- 黑客矩陣背景 Canvas -->
    <canvas id="matrix"></canvas>

    <!-- 名片主體 -->
    <div id="card-container">
        <h1 id="title">   餅乾 cookie   </h1>
        <p class="bio">ID: ABestCookie | 暁山 瑞希 | 怪人一個</p>

        <div class="links-container">
            <!-- 預留的迷因連結按鈕區域 -->

            <!-- 按鈕 1：(範例：你可以放湊企鵝或其他迷因) -->
            <a href="#" class="meme-btn" target="_blank">
                <!-- 替換 src 為你的湊企鵝 GIF 連結 -->
                <img src="https://i.imgur.com/8QzG5zF.gif" alt="湊企鵝">
                <span>CONNECT</span>
            </a>

            <!-- 按鈕 2：(範例：放你的作品集) -->
            <a href="#" class="meme-btn" target="_blank">
                <!-- 替換 src 為另一個迷因 -->
                <img src="https://i.imgur.com/JjK5W5L.gif" alt="迷因 2">
                <span>PORTFOLIO</span>
            </a>

            <!-- 按鈕 3 -->
            <a href="#" class="meme-btn" target="_blank">
                <img src="https://i.imgur.com/rNf0LqW.png" alt="ASCII 貓">
                <span>PROJECTS</span>
            </a>

            <!-- 按鈕 4：(預留更多迷因) -->
            <a href="#" class="meme-btn" target="_blank">
                <img src="https://i.imgur.com/Yh3zYf7.gif" alt="Nyan Cat">
                <span>MEME VAULT</span>
            </a>
        </div>
    </div>

    <footer>[ SYSTEM STATUS: SUKA BLYAT | SECURED BY MEMES ]</footer>

    <!-- --- 黑客矩陣背景 JavaScript --- -->
    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const nums = '0123456789';
        const alphabet = katakana + latin + nums;

        const fontSize = 16;
        let columns = Math.floor(window.innerWidth / fontSize);
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        // 支援高 DPI 並初始化 canvas 大小
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            canvas.width = Math.floor(window.innerWidth * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);

            // 重新計算欄數與雨滴陣列長度
            columns = Math.floor(window.innerWidth / fontSize);
            rainDrops.length = 0;
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = 1;
            }
        }

        resizeCanvas();

        const draw = () => {
            // 背景漸變（製造流動感）
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 文字顏色（螢光綠）
            ctx.fillStyle = '#0f0'; 
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                // 隨機選擇字元
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                // 繪製字元
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                // 如果字元掉出螢幕，則重新從頂部開始
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        // 重新調整視窗大小時自動修正（含重算欄數）
        window.addEventListener('resize', () => {
            resizeCanvas();
        });

        // 啟動動畫
        setInterval(draw, 30);
    </script>
</body>
</html>
