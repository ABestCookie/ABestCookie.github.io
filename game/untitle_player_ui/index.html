<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <!-- 引入 Font Awesome 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 模擬手機裝置面板 */
        .player-card {
            width: 100%;
            max-width: 380px;
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 頂部導覽列 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
            font-size: 1.2rem;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #333;
            font-size: 1.2rem;
            padding: 4px;
            transition: opacity 0.2s;
        }

        .icon-btn:hover {
            opacity: 0.6;
        }

        /* 專輯封面容器 */
        .album-art-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background-color: #e2f4f6;
            border: 2px solid #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .album-art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 歌名與動作欄 */
        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }

        .song-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #111;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* 匹配圖片風格 */
            text-align: center;
            flex-grow: 1;
        }

        /* 進度條區域 */
        .progress-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar-container {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .progress-bar {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            background: #d1d5db;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        /* 自訂進度條拖曳點 (Thumb) */
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #111;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .time-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #4b5563;
            font-weight: 500;
        }

        /* 播放控制區域 */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 48px;
            margin-top: 8px;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #111;
            font-size: 1.6rem;
            transition: transform 0.15s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-btn:hover {
            opacity: 0.7;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-btn {
            font-size: 2rem;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <!-- 頂部導覽 -->
        <div class="top-bar">
            <button class="icon-btn"><i class="fa-solid fa-chevron-down"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>

        <!-- 封面圖片 -->
        <div class="album-art-container">
        </div>

        <!-- 歌名與副圖示 -->
        <div class="title-bar">
            <button class="icon-btn"><i class="fa-solid fa-list-ul"></i></button>
            <div class="song-title">Untitled</div>
            <button class="icon-btn" id="addBtn"><i class="fa-solid fa-plus"></i></button>
        </div>

        <!-- 進度條 -->
        <div class="progress-section">
            <div class="progress-bar-container">
                <input type="range" class="progress-bar" id="seekBar" min="0" max="99" value="39">
            </div>
            <div class="time-labels">
                <span id="currentTime">0:39</span>
                <span id="duration">1:39</span>
            </div>
        </div>

        <!-- 控制鍵 -->
        <div class="controls">
            <button class="control-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
            <button class="control-btn play-btn" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const seekBar = document.getElementById('seekBar');
        const currentTimeLabel = document.getElementById('currentTime');
        const durationLabel = document.getElementById('duration');
        const addBtn = document.getElementById('addBtn');

        let isPlaying = false;
        let timer = null;
        const totalSeconds = 99; // 1:39 對應 99 秒

        // 格式化秒數為 mm:ss
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // 切換播放 / 暫停
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playIcon.classList.remove('fa-play');
                playIcon.classList.add('fa-pause');
                startTimer();
            } else {
                playIcon.classList.remove('fa-pause');
                playIcon.classList.add('fa-play');
                stopTimer();
            }
        });

        // 模擬音樂播放計時器
        function startTimer() {
            stopTimer();
            timer = setInterval(() => {
                let currentValue = parseInt(seekBar.value);
                if (currentValue < totalSeconds) {
                    currentValue++;
                    seekBar.value = currentValue;
                    currentTimeLabel.textContent = formatTime(currentValue);
                } else {
                    // 播放完畢重置
                    isPlaying = false;
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play');
                    seekBar.value = 0;
                    currentTimeLabel.textContent = formatTime(0);
                    stopTimer();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timer) clearInterval(timer);
        }

        // 手動拖曳進度條
        seekBar.addEventListener('input', () => {
            currentTimeLabel.textContent = formatTime(seekBar.value);
        });

        // 加入按鈕互動範例
        addBtn.addEventListener('click', () => {
            const icon = addBtn.querySelector('i');
            if (icon.classList.contains('fa-plus')) {
                icon.classList.remove('fa-plus');
                icon.classList.add('fa-check');
            } else {
                icon.classList.remove('fa-check');
                icon.classList.add('fa-plus');
            }
        });
    </script>
</body>
</html>
